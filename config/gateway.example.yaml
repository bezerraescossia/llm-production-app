# Gateway configuration. Copy to config/gateway.local.yaml (git-ignored), edit, and set
# GATEWAY_CONFIG=config/gateway.local.yaml. Provider credentials come from the environment:
#   ANTHROPIC_API_KEY, OPENAI_API_KEY
# Model ids must be exact (no "latest" aliases) and known to the model library.

# Tier used by the chat route. The prompt router (a later spec) will choose tiers per request.
default_tier: medium

timeouts:
  first_output_seconds: 15   # per attempt: how long to wait for a provider to start answering
  pre_output_seconds: 45     # overall wait for the first piece, across all attempts, retries and fallbacks
  idle_seconds: 20           # longest silence between streamed pieces
  total_seconds: 120         # whole completion, including retries and backoff

retry:
  max_attempts_per_model: 2  # one retry
  backoff_base_seconds: 0.25
  backoff_max_seconds: 2.0   # exponential with full jitter

cooldown:
  failure_threshold: 3       # consecutive failures before a model is skipped
  seconds: 30                # how long it is skipped

# Generation settings: the defaults below apply when a caller asks for nothing; callers may lower a
# value but never exceed the ceiling. Some models (the Claude 5.5 and GPT-5 families) accept only
# their own default temperature; for those the gateway drops `temperature` explicitly and logs
# `gateway_params_dropped` once at startup, so the value below is ignored for them.
#
# Fallback stays inside a tier, in the order listed. Alternating providers lets a tier survive
# the outage of one provider.
tiers:
  small:
    models: [anthropic/claude-haiku-5-5, openai/gpt-5-nano-2025-08-07]
    generation:
      max_output_tokens: {default: 2048, ceiling: 4096}
      temperature: {default: 0.3, ceiling: 1.0}
  medium:
    models: [anthropic/claude-sonnet-5-5, openai/gpt-5-mini-2025-08-07]
    generation:
      max_output_tokens: {default: 4096, ceiling: 8192}
      temperature: {default: 0.3, ceiling: 1.0}
  large:
    models: [anthropic/claude-opus-5-5, openai/gpt-5-2025-08-07]
    generation:
      max_output_tokens: {default: 8192, ceiling: 16384}
      temperature: {default: 0.3, ceiling: 1.0}
