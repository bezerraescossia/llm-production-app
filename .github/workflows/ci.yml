name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Only the `tests` job saves the uv cache; lint and types restore it. Saving the same key from
# parallel jobs makes all but one fail with a harmless but noisy warning.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: false
      - run: uv sync --frozen
      - run: uv run mypy --strict src
      - run: uv run pyright

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen
      - run: uv run pytest tests/unit tests/contract tests/integration

  contract-breaking:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare the contract with the base
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "No base to compare against."
          else
            scripts/contract-diff.sh "$BASE_REF"
          fi

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create .env with a random service token
        run: echo "SERVICE_TOKENS=$(openssl rand -hex 24)" > .env
      - name: Start the stack (must be healthy within 3 minutes)
        run: timeout 180 docker compose up --wait --build
      - name: Smoke test
        run: |
          SERVICE_TOKEN="$(grep '^SERVICE_TOKENS=' .env | cut -d= -f2)" scripts/smoke.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
