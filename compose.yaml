# One command: docker compose up --wait
# Image tags are pinned and verified; digests recorded in comments.
services:
  service:
    build: .
    image: ai-services:dev
    ports:
      - "8080:8080"
    environment:
      SERVICE_TOKENS: ${SERVICE_TOKENS:?set SERVICE_TOKENS in .env (see .env.example)}
      READINESS_DEPENDENCIES: ${READINESS_DEPENDENCIES:-postgres=postgres:5432,redis=redis:6379,qdrant=qdrant:6333}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-262144}
      MAX_MESSAGES: ${MAX_MESSAGES:-100}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-20}
      PLACEHOLDER_TOKEN_DELAY_MS: ${PLACEHOLDER_TOKEN_DELAY_MS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    stop_grace_period: 30s

  postgres:
    # postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # redis/redis-stack-server:7.4.0-v3@sha256:7d8e657d60d525534d6abe96e7645ab30ef1b4f1ffedc6eeb2d4d4283b3a49b9
    image: redis/redis-stack-server:7.4.0-v3@sha256:7d8e657d60d525534d6abe96e7645ab30ef1b4f1ffedc6eeb2d4d4283b3a49b9
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    # qdrant/qdrant:v1.15.0@sha256:709bd2656bb929b745a956260f61a6395d09f8eed72c5bf2131985ae70f95974
    image: qdrant/qdrant:v1.15.0@sha256:709bd2656bb929b745a956260f61a6395d09f8eed72c5bf2131985ae70f95974
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl or wget; open a TCP connection with bash.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
